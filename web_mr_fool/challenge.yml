name: "Mr. Fool"
author: "VascoZ"
category: "web"

description: |
  "The Fool yang tidak berasal dari era ini;
  Penguasa Misterius di atas kabut abu-abu;
  Raja Kuning dan Hitam yang memegang keberuntungan."

  Untuk mencapai puncak Sequence, setiap ramuan harus dicerna secara berurutan. Tidak ada jalan pintas menuju Sequence 0. Bisakah kamu mencerna kelima ramuan dan mengungkap rahasia The Fool?

  {URL}

type: "DynamicService"
value: 500

flags:
  - "TecFest26{h34rtb34t_h34rtbr34k_4ll_0v3r_g4l4u_p4r4h_b4ng3t}"

tags:
  - medium
  - chained-challenge
  - recon
  - sqli
  - mass-assignment
  - jwt
  - lfi

hints:
  - "Sequence 9: Perhatikan apa yang diabaikan orang lain: periksa direktori yang dilarang bagi mesin dan periksa setiap layer header respons."
  - "Sequence 8: Panggung pertunjukan database akan menertawakan kesalahannya sendiri jika diberi lelucon SQL yang tepat. Skema tabel dapat diintip."
  - "Sequence 7: Antarmuka pengguna (UI) tidak selalu membatasi atribut apa saja yang dapat diterima dan diproses oleh server."
  - "Sequence 6: Sebuah topeng hanya sekuat pemeriksaan terhadapnya. Apakah server benar-benar memvalidasi tanda tangan token?"
  - "Sequence 3: Sejarah kuno dapat dibaca dengan melangkah keluar dari rak arsip utama menggunakan path traversal."

scripts:
  start: docker compose -p {{ .slug }} up --build -d
  stop: docker compose -p {{ .slug }} down --volumes

