services:
  istaroth:
    build: .
    image: pwn_istaroth
    restart: unless-stopped
    ports:
      - "${BIND_IP:-100.105.142.39}:40601:40601"
    volumes:
      - ./flag.txt:/home/istaroth_pwn/flag.txt:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
