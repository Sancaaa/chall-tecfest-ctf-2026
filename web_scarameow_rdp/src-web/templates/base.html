<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PT. Scarameow Logistics{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <!--
    build: scm-portal-v2.5.0
    deploy: 2026-02-14
    note: lihat /about untuk changelog
    ticket: #SCM-1042 (SQLi), #SCM-1103 (API deprecation)
  -->
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-brand">
        <span class="nav-name">SCARAMEOW</span>
      </a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/search">Cari Tiket</a>
        {% if session.username %}
          <a href="/dashboard">Dashboard</a>
          <a href="/logout" class="nav-logout">Logout ({{ session.username }})</a>
        {% else %}
          <a href="/login" class="nav-login">Login</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer-container">
      <p>© 2026 PT. Scarameow Logistics — Denpasar, Bali</p>
      <p class="footer-meta">Internal Portal v2.5.0 · Build 20260214</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
