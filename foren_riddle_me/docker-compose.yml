# Port skema "K CC W I": Forensic F (Riddle Me This) = 20601.
# Default bind ke IP Tailscale Homelab (100.105.142.39); override dengan BIND_IP=127.0.0.1 untuk tes lokal.
services:
  riddle-me-this-nc:
    build: .
    container_name: tecfest-foren-riddle-me
    restart: unless-stopped
    ports:
      - "${BIND_IP:-100.105.142.39}:20601:13370"
    environment:
      - PORT=13370
      - FLAG=TecFest26{l00k_wh4t_1_g0t_b4tm4n}
      - IDLE_TIMEOUT=900
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: "0.5"
