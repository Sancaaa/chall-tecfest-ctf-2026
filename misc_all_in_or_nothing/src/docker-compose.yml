services:
  all-in-or-nothing:
    build: .
    container_name: tecfest-misc-all-in-or-nothing
    restart: unless-stopped
    ports:
      - "13500:5000"
    environment:
      - FLAG=TecFest26{jud1_4d4l4h_j4l4n_n1nj4_ku}
      - DB_PATH=/tmp/all_in.db
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
