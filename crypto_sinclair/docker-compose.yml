# Port skema "K CC W I": Cryptography D (Sinclair) = 10401.
# Default bind ke IP Tailscale Homelab (100.105.142.39); override dengan BIND_IP=127.0.0.1 untuk tes lokal.
services:
  sinclair:
    build: .
    container_name: tecfest-crypto-sinclair
    restart: unless-stopped
    ports:
      - "${BIND_IP:-100.105.142.39}:10401:10401"
    environment:
      - FLAG=TecFest26{th3_gr34t_s1ncl41r_d03s_1t_4g41n}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 256m
    cpus: 0.5
